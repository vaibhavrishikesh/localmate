name: Android Release AAB

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "capacitor.config.ts"
      - "package.json"
      - ".github/workflows/android-release.yml"

jobs:
  build:
    name: Build signed release AAB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.LOCALMATE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.LOCALMATE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.LOCALMATE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LOCALMATE_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Missing LOCALMATE_KEYSTORE_BASE64 secret"
            exit 1
          fi
          mkdir -p android/keystore
          echo "$KEYSTORE_BASE64" | base64 -d > android/keystore/localmate-release.jks
          cat > android/keystore/keystore.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=keystore/localmate-release.jks
          EOF

      - name: Accept Android licenses
        run: |
          mkdir -p "$ANDROID_SDK_ROOT/licenses"
          echo -e "24333f8a63b6825ea9c5514f6c9034aa4ea5548\n84831b9409646a918e30573bab4c9c91346d8abd\nd56f5187479451eabf01fb78af6dfcb131a6481e" > "$ANDROID_SDK_ROOT/licenses/android-sdk-license"

      - name: Bundle release
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: localmate-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30
